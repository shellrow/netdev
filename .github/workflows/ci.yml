name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: swatinem/rust-cache@v2

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Test default Apple features
        if: runner.os == 'macOS'
        run: cargo test
      - run: cargo test --all-features
      - run: cargo test --no-default-features

      - name: Check public documentation
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --no-deps --all-features
          cargo doc --no-deps --no-default-features

      - name: Check iOS and tvOS
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-tvos
          cargo check --target aarch64-apple-ios --all-features
          cargo check --target aarch64-apple-tvos --all-features

  apple-mobile:
    name: Check iOS
    runs-on: macOS-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-ios
          - aarch64-apple-ios-sim

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update --target ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2

      - name: Run cargo check
        run: cargo check --target ${{ matrix.target }}

  cross:
    name: Cross-target checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swatinem/rust-cache@v2
      - run: |
          targets=(x86_64-unknown-linux-musl i686-unknown-linux-musl armv7-linux-androideabi aarch64-linux-android x86_64-unknown-freebsd x86_64-unknown-netbsd)
          rustup target add "${targets[@]}"
          for target in "${targets[@]}"; do
            cargo check --target "$target" --all-features
          done
